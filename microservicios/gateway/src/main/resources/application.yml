server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/6109d4ab-3dff-41c5-a7d7-a2cdc4fa7abd/v2.0
          jwk-set-uri: https://login.microsoftonline.com/6109d4ab-3dff-41c5-a7d7-a2cdc4fa7abd/discovery/v2.0/keys
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      server:
        webflux:
          routes:
            - id: bff-service
              uri: http://bff:8080
              predicates:
                - Path=/api/v1/**
              filters:
                - name: RewritePath
                  args:
                    regexp: ^/api/v1/+(.*)
                    replacement: /$1

          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.server: DEBUG