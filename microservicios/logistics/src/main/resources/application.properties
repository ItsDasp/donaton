spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/${AZURE_TENANT_ID:common}/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://sts.windows.net/${AZURE_TENANT_ID:common}/discovery/keys
azure.ad.audience=${AZURE_CLIENT_ID:test-client-id}
