# Disable RabbitMQ auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# RabbitMQ Properties for tests
rabbitmq.exchanges.logistics=logistics.events
rabbitmq.exchanges.deadLetter=logistics.dlq
rabbitmq.logistics-events.name=logistics.events.queue
rabbitmq.logistics-events.routing-key=logistics.events
rabbitmq.logistics-events-dlq.name=logistics.events.dlq
rabbitmq.logistics-events-dlq.routing-key=logistics.dlq
