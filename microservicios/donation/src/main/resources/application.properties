spring.application.name=donation-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/${AZURE_TENANT_ID:common}/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://sts.windows.net/${AZURE_TENANT_ID:common}/discovery/keys
azure.ad.audience=${AZURE_CLIENT_ID:test-client-id}

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/donaton_donation
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

needs.base-url=http://needs:8080
logistics.base-url=http://logistics:8080

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:secret}
rabbitmq.events.exchange=${RABBITMQ_EVENTS_EXCHANGE:donaton.domain.events}