name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.5.7
  PROJECT_NAME: donaton
  ENVIRONMENT: dev
  REPOSITORY_URL: https://github.com/ItsDasp/donaton
  BRANCH_NAME: feat/azure-auth
  TERRAFORM_STATE_BUCKET: donaton-bucket
  TERRAFORM_LOCK_TABLE: donaton-lock-table

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false



      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="repository_url=${{ env.REPOSITORY_URL }}" \
            -var="branch_name=${{ env.BRANCH_NAME }}" \
            -var="terraform_state_bucket=${{ env.TERRAFORM_STATE_BUCKET }}" \
            -var="terraform_lock_table=${{ env.TERRAFORM_LOCK_TABLE }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform_outputs
        working-directory: ./terraform
        run: |
          INSTANCE_IP=$(terraform output -raw instance_public_ip)
          APP_URL=$(terraform output -raw application_url)
          GATEWAY_URL=$(terraform output -raw gateway_url)
          
          echo "instance_public_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "application_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "gateway_url=$GATEWAY_URL" >> $GITHUB_OUTPUT

      - name: Display Deployment Information
        run: |
          echo "=== Deployment Complete ==="
          echo "Instance Public IP: ${{ steps.terraform_outputs.outputs.instance_public_ip }}"
          echo "Application URL: ${{ steps.terraform_outputs.outputs.application_url }}"
          echo "Gateway URL: ${{ steps.terraform_outputs.outputs.gateway_url }}"
          echo ""
          echo "You can access the application at:"
          echo "${{ steps.terraform_outputs.outputs.application_url }}"

      - name: Wait for Application to Start
        run: |
          echo "Waiting for application to start..."
          sleep 120
          
          # Check if frontend is accessible
          APPLICATION_URL="${{ steps.terraform_outputs.outputs.application_url }}"
          if curl -f -s -o /dev/null "$APPLICATION_URL"; then
            echo "Frontend is accessible"
          else
            echo "Frontend may still be starting up"
          fi

      - name: Comment Deployment Info on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Deployment Complete
              
              **Instance Public IP:** \`${{ steps.terraform_outputs.outputs.instance_public_ip }}\`
              
              **Application URL:** ${{ steps.terraform_outputs.outputs.application_url }}
              
              **Gateway URL:** ${{ steps.terraform_outputs.outputs.gateway_url }}
              
              The application should be accessible within a few minutes.`
            })